<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Projects | Justin Mack</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Your CSS -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Navbar -->
    <div id="nav-placeholder"></div>


    <!-- Projects Section -->
    <main class="container py-5">

        <div class="text-center mb-5">

            <h1 class="fw-bold">
                My Projects
            </h1>

            <p class="text-muted">
                Here are a few projects I have worked on.
            </p>

        </div>


        <div class="row g-4">

            <!-- Project 1 -->
            <div class="col-md-6">

                <div class="card h-100 shadow-sm">

                    <!-- Replace with your image -->
                    <img
                        src="project1.jpg"
                        class="card-img-top"
                        alt="Project 1"
                    >

                    <div class="card-body">

                        <h2 class="h4 card-title">
                            Project One
                        </h2>

                        <p class="card-text">
                            Website Portfolio
                        </p>

                    </div>

                </div>

            </div>


            <!-- Project 2 -->
            <div class="col-md-6">

                <div class="card h-100 shadow-sm">

                    <!-- Replace with your image -->
                    <img
                        src="project2.jpg"
                        class="card-img-top"
                        alt="Project 2"
                    >

                    <div class="card-body">

                        <h2 class="h4 card-title">
                            Project Two
                        </h2>

                        <p class="card-text">
                           Website web starter
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
        $("#nav-placeholder").load("navbar.html #site-nav");
    </script>

    <!-- Bootstrap -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
